services:
  db:
    image: postgres:14-alpine
    container_name: ims_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ../../pgdata:/var/lib/postgresql/data
      - ../db-initialization:/docker-entrypoint-initdb.d
      - ../../db_backups:/db_backups
  web:
    container_name: ims_web
    build: .
    environment:
      DEBUG: 1
      DEVELOPMENT: 1
    env_file:
       - .env
    command: bash /code/start_django_server.sh
    volumes:
      - ../ims:/ims
      - ../../media:/ims/media
    ports:
      - "8000:8000"
    depends_on:
      - db

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"
