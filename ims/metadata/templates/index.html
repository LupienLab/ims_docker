{% extends "base.html" %}
{% load static %}
{% block content %}
<section class="container mb-5">
  <h2 class="mb-4">Dashboard Filters</h2>
  <div class="row g-3 align-items-center">
    <div class="col-auto">
      <label for="ownerFilter" class="col-form-label col-form-label-sm">Owner:</label>
    </div>
    <div class="col-auto">
      <select class="form-select form-select-sm" id="ownerFilter">
        <option value="">All Owners</option>
      </select>
    </div>

    <div class="col-auto">
      <label for="statusFilter" class="col-form-label col-form-label-sm">Status:</label>
    </div>
    <div class="col-auto">
      <select class="form-select form-select-sm" id="statusFilter">
        <option value="">All</option>
      </select>
    </div>

    <div class="col-auto">
      <label for="diseaseFilter" class="col-form-label col-form-label-sm">Disease Site:</label>
    </div>
    <div class="col-auto">
      <select class="form-select form-select-sm" id="diseaseFilter">
        <option value="">All</option>
      </select>
    </div>
  </div>

  <h2 class="mt-5 mb-4">Charts Overview</h2>
  <div class="row gy-4">
    <div class="col-md-6">
      <canvas id="chartOwner" class="chartjs"></canvas>
    </div>
    <div class="col-md-6">
      <canvas id="horizontalBarChart" class="chartjs"></canvas>
    </div>
  </div>
</section>
<section class="container mb-5">
  <h2 class="text-center">Browse projects</h2>
  <div class="row mb-4">
    <div class="col-xs-6 col-sm-6 col-md-6" style="position: relative; height: 35rem; text-align: center;">
      <canvas id="disease" class="chartjs" style="display: block; margin: 0 auto; width: 100% !important; height: 100% !important;"></canvas>
    </div>
    <div class="col-xs-6 col-sm-6 col-md-6" style="position: relative; height: 35rem; text-align: center;">
      <canvas id="owner" class="chartjs" style="display: block; margin: 0 auto; width: 100% !important; height: 100% !important;"></canvas>
    </div>
  </div>
  <div class="row">
    <div class="col-xs-6 col-sm-6 col-md-6" style="position: relative; height: 35rem; text-align: center;">
      <canvas id="assay" class="chartjs" style="display: block; margin: 0 auto; width: 100% !important; height: 100% !important;"></canvas>
    </div>
    <div class="col-xs-6 col-sm-6 col-md-6" style="position: relative; height: 35rem; text-align: center;">
      <canvas id="projectlabel" class="chartjs" style="display: block; margin: 0 auto; width: 100% !important; height: 100% !important;"></canvas>
    </div>
  </div>
</section>
<section class="container mb-5">
  <h2>Export metadata from last 200 days</h2>
  <a href="{% url 'exportSequencingdata' %}"><button type="button" class="btn btn-primary">Sequencing data</button></a>
  <a href="{% url 'exportnoSequencingdata' %}"><button type="button" class="btn btn-primary">Experiments with NO
      sequencing data added</button></a>
</section>
<section class="container mb-5">
  <h2 class="text-center mb-4">Browse experiments →</h2>
  <div class="scroll-wrapper">
    <div id="matrixDataGrid"></div>
  </div>
</section>

<section class="container mb-5">
  <h2 class="text-center mb-4">Active Projects</h2>
  <div id="gridjs-active-projects"></div>
</section>

<script type="text/javascript" src="{% static 'createCharts.js' %}" defer></script>
<script type="text/javascript" src="{% static 'dashboard.js' %}" defer></script>
{% endblock %}
